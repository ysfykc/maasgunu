<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f0">
<title>Maaş Günü</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f7f5f0; --bg2:#edeae3; --bg3:#e3e0d8;
  --surf:#fff; --brd:rgba(0,0,0,.07); --brd2:rgba(0,0,0,.13);
  --txt:#1a1814; --txt2:#706d66; --txt3:#a8a49c;
  --green:#1a7a42; --green2:#2aad62; --green-bg:#e6f4ec;
  --red:#c03535; --red2:#e05050; --red-bg:#fdeaea;
  --amber:#b86010; --amber-bg:#fdf3e3;
  --blue:#1a3a8b; --blue-bg:#eaeffa;
  --purple:#5a3a8b; --purple-bg:#f0eafa;
  --r:12px; --rp:999px; --nav:64px; --top:58px;
  --fd:'DM Sans',sans-serif; --fs:'Instrument Serif',serif;
  --sh:0 2px 12px rgba(0,0,0,.07); --sh2:0 4px 24px rgba(0,0,0,.10);
}
[data-theme=dark] {
  --bg:#100f0d; --bg2:#1a1815; --bg3:#242118;
  --surf:#1e1c18; --brd:rgba(255,255,255,.06); --brd2:rgba(255,255,255,.12);
  --txt:#f0ece4; --txt2:#9a9690; --txt3:#5a5852;
  --green:#4aad78; --green2:#5acd88; --green-bg:#0a1f14;
  --red:#e05050; --red2:#f07070; --red-bg:#2a0e0e;
  --amber:#e09040; --amber-bg:#201008;
  --blue:#5a8ad4; --blue-bg:#0a1228;
  --purple:#9a70d4; --purple-bg:#1a1028;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:var(--fd);background:var(--bg);color:var(--txt);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-y:auto}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--surf);border-bottom:.5px solid var(--brd2);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:200}
.logo{font-family:var(--fs);font-size:20px;display:flex;align-items:center;gap:8px;font-weight:600}
.logo-ico{width:28px;height:28px;background:linear-gradient(135deg,var(--green),var(--green2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tbr{display:flex;align-items:center;gap:8px}

/* AY BAR */
.ay-bar{position:fixed;top:var(--top);left:0;right:0;background:var(--surf);border-bottom:.5px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:46px;z-index:199}
.ay-nav{width:34px;height:34px;border-radius:8px;background:var(--bg2);border:.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2);cursor:pointer}
.ay-lbl{font-size:15px;font-weight:600;color:var(--txt)}

/* HERO & CARDS */
main{padding-top:calc(var(--top) + 60px);padding-bottom:100px}
.hero{margin:0 16px 20px;display:grid;grid-template-columns:repeat(3, 1fr);gap:8px}
.hcard{border-radius:16px;padding:12px 8px;text-align:center;border:.5px solid var(--brd2)}
.hcard.gelir{background:var(--green-bg);border-color:var(--green)}
.hcard.gider{background:var(--red-bg);border-color:var(--red)}
.hcard.kalan{background:var(--txt);color:var(--bg)}
.hcard-lbl{font-size:10px;text-transform:uppercase;margin-bottom:4px;font-weight:700;opacity:0.8}
.hcard-val{font-family:var(--fs);font-size:16px;font-weight:600}

/* FAB (ARTU BUTONU) - DÜZELTİLDİ */
.fab {
  position: fixed;
  bottom: 85px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 28px;
  background: var(--txt);
  color: var(--bg);
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  z-index: 999;
  border: none;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.fab:active { transform: scale(0.85); }

/* POPUP MENÜ */
.tip-popup {
  position: fixed;
  bottom: 150px;
  right: 20px;
  background: var(--surf);
  border-radius: 16px;
  padding: 8px;
  box-shadow: var(--sh2);
  display: none;
  flex-direction: column;
  gap: 4px;
  z-index: 998;
  border: .5px solid var(--brd2);
}
.tip-popup.on { display: flex; }
.tip-item {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.tip-item:hover { background: var(--bg2); }

/* MODAL */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: flex-end;
}
.ov.on { display: flex; }
.modal {
  width: 100%;
  background: var(--surf);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 40px;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}
.ov.on .modal { transform: translateY(0); }
.mhandle { width: 40px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 0 auto 20px; }
.mttl { font-family: var(--fs); font-size: 24px; margin-bottom: 20px; }
.inp-grp { margin-bottom: 16px; }
.inp-lbl { font-size: 12px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; display: block; }
.inp { 
  width: 100%; 
  padding: 14px; 
  border-radius: 12px; 
  border: 1.5px solid var(--brd2); 
  background: var(--bg); 
  color: var(--txt);
  font-size: 16px;
  outline: none;
}
.inp:focus { border-color: var(--txt); }
.mbtn {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  background: var(--txt);
  color: var(--bg);
  font-weight: 700;
  border: none;
  margin-top: 10px;
  cursor: pointer;
}

/* NAV */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: var(--surf);
  border-top: .5px solid var(--brd2);
  display: flex;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
}
.nitem {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--txt3);
  gap: 4px;
  cursor: pointer;
}
.nitem.on { color: var(--green); }
.nico { font-size: 20px; }

</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-ico">💰</div>
    <span>Maaş Günü</span>
  </div>
  <div class="tbr">
    <button onclick="temaDegis()" style="background:var(--bg2); border:none; padding:8px; border-radius:8px; cursor:pointer">🌙</button>
  </div>
</header>

<div class="ay-bar">
  <div class="ay-nav" onclick="ayGit(-1)">‹</div>
  <div class="ay-lbl" id="ayBaslik">Ekim 2025</div>
  <div class="ay-nav" onclick="ayGit(1)">›</div>
</div>

<main id="main">
  <div class="hero">
    <div class="hcard gelir">
      <div class="hcard-lbl">GELİR</div>
      <div class="hcard-val" id="topGelir">₺0</div>
    </div>
    <div class="hcard gider">
      <div class="hcard-lbl">GİDER</div>
      <div class="hcard-val" id="topGider">₺0</div>
    </div>
    <div class="hcard kalan">
      <div class="hcard-lbl">KALAN</div>
      <div class="hcard-val" id="topKalan">₺0</div>
    </div>
  </div>

  <div id="liste" style="padding: 0 16px;"></div>
</main>

<div class="tip-popup" id="tipPopup">
  <div class="tip-item" onclick="formAc('gelir')" style="color:var(--green)">➕ Gelir Ekle</div>
  <div class="tip-item" onclick="formAc('gider')" style="color:var(--red)">➖ Gider Ekle</div>
</div>

<button class="fab" onclick="menuAc()">+</button>

<nav class="nav">
  <div class="nitem on" onclick="sekmeDegis(0)">
    <span class="nico">🏠</span>
    <span>Özet</span>
  </div>
  <div class="nitem" onclick="sekmeDegis(1)">
    <span class="nico">📊</span>
    <span>Analiz</span>
  </div>
</nav>

<div class="ov" id="modalOv" onclick="if(event.target===this)formKapat()">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mttl" id="modalTtl">Ekle</div>
    <div class="inp-grp">
      <label class="inp-lbl">Açıklama</label>
      <input type="text" id="inpAd" class="inp" placeholder="Örn: Kira, Maaş...">
    </div>
    <div class="inp-grp">
      <label class="inp-lbl">Tutar (₺)</label>
      <input type="number" id="inpTutar" class="inp" inputmode="decimal" placeholder="0.00">
    </div>
    <button class="mbtn" onclick="kaydet()">Kaydet</button>
  </div>
</div>

<script>
let veri = JSON.parse(localStorage.getItem('maas_veri')) || { aylar: {} };
let bugun = new Date();
let suanAy = bugun.getFullYear() + '-' + String(bugun.getMonth() + 1).padStart(2, '0');
let aktifTip = 'gelir';

function kaydetJS() {
  localStorage.setItem('maas_veri', JSON.stringify(veri));
  render();
}

function menuAc() {
  document.getElementById('tipPopup').classList.toggle('on');
}

function formAc(tip) {
  aktifTip = tip;
  document.getElementById('modalTtl').textContent = tip === 'gelir' ? 'Gelir Ekle' : 'Gider Ekle';
  document.getElementById('tipPopup').classList.remove('on');
  document.getElementById('modalOv').classList.add('on');
  document.getElementById('inpAd').focus();
}

function formKapat() {
  document.getElementById('modalOv').classList.remove('on');
  document.getElementById('inpAd').value = '';
  document.getElementById('inpTutar').value = '';
}

function kaydet() {
  const ad = document.getElementById('inpAd').value;
  const tutar = parseFloat(document.getElementById('inpTutar').value);

  if(!ad || !tutar) return alert("Lütfen alanları doldurun.");

  if(!veri.aylar[suanAy]) veri.aylar[suanAy] = { gelir: [], gider: [] };
  
  veri.aylar[suanAy][aktifTip].push({
    id: Date.now(),
    ad: ad,
    tutar: tutar
  });

  kaydetJS();
  formKapat();
}

function sil(tip, id) {
  if(!confirm("Silmek istediğine emin misin?")) return;
  veri.aylar[suanAy][tip] = veri.aylar[suanAy][tip].filter(item => item.id !== id);
  kaydetJS();
}

function ayGit(yön) {
  let [y, m] = suanAy.split('-').map(Number);
  let d = new Date(y, m - 1 + yön, 1);
  suanAy = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  render();
}

function render() {
  const ayIsimleri = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  let [y, m] = suanAy.split('-').map(Number);
  document.getElementById('ayBaslik').textContent = ayIsimleri[m-1] + ' ' + y;

  const data = veri.aylar[suanAy] || { gelir: [], gider: [] };
  const tGelir = data.gelir.reduce((a, b) => a + b.tutar, 0);
  const tGider = data.gider.reduce((a, b) => a + b.tutar, 0);
  
  document.getElementById('topGelir').textContent = '₺' + tGelir.toLocaleString('tr-TR');
  document.getElementById('topGider').textContent = '₺' + tGider.toLocaleString('tr-TR');
  document.getElementById('topKalan').textContent = '₺' + (tGelir - tGider).toLocaleString('tr-TR');

  let html = '';
  data.gelir.forEach(item => {
    html += `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--surf); padding:14px; border-radius:12px; margin-bottom:8px; border:.5px solid var(--brd)">
      <div><small style="color:var(--green); font-weight:700">GELİR</small><br><b>${item.ad}</b></div>
      <div style="text-align:right"><b style="color:var(--green)">+₺${item.tutar}</b><br><span onclick="sil('gelir', ${item.id})" style="font-size:10px; color:var(--red); cursor:pointer">Sil</span></div>
    </div>`;
  });
  data.gider.forEach(item => {
    html += `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--surf); padding:14px; border-radius:12px; margin-bottom:8px; border:.5px solid var(--brd)">
      <div><small style="color:var(--red); font-weight:700">GİDER</small><br><b>${item.ad}</b></div>
      <div style="text-align:right"><b style="color:var(--red)">-₺${item.tutar}</b><br><span onclick="sil('gider', ${item.id})" style="font-size:10px; color:var(--red); cursor:pointer">Sil</span></div>
    </div>`;
  });

  document.getElementById('liste').innerHTML = html || '<div style="text-align:center; padding:40px; color:var(--txt3)">Bu ay henüz kayıt yok.</div>';
}

function temaDegis() {
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
}

function sekmeDegis(i) {
  document.querySelectorAll('.nitem').forEach((el, idx) => el.classList.toggle('on', idx === i));
}

window.onload = render;
</script>
</body>
</html>
