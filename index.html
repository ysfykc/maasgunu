<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f0">
<title>Maaş Günü</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f7f5f0; --bg2:#edeae3; --bg3:#e3e0d8;
  --surf:#fff; --brd:rgba(0,0,0,.07); --brd2:rgba(0,0,0,.13);
  --txt:#1a1814; --txt2:#706d66; --txt3:#a8a49c;
  --green:#1a7a42; --green2:#2aad62; --green-bg:#e6f4ec;
  --red:#c03535; --red2:#e05050; --red-bg:#fdeaea;
  --amber:#b86010; --amber-bg:#fdf3e3;
  --blue:#1a3a8b; --blue-bg:#eaeffa;
  --purple:#5a3a8b; --purple-bg:#f0eafa;
  --r:12px; --rp:999px; --nav:64px; --top:58px;
  --fd:'DM Sans',sans-serif; --fs:'Instrument Serif',serif;
  --sh:0 2px 12px rgba(0,0,0,.07); --sh2:0 4px 24px rgba(0,0,0,.10);
}
[data-theme=dark] {
  --bg:#100f0d; --bg2:#1a1815; --bg3:#242118;
  --surf:#1e1c18; --brd:rgba(255,255,255,.06); --brd2:rgba(255,255,255,.12);
  --txt:#f0ece4; --txt2:#9a9690; --txt3:#5a5852;
  --green:#4aad78; --green2:#5acd88; --green-bg:#0a1f14;
  --red:#e05050; --red2:#f07070; --red-bg:#2a0e0e;
  --amber:#e09040; --amber-bg:#201008;
  --blue:#5a8ad4; --blue-bg:#0a1228;
  --purple:#9a70d4; --purple-bg:#1a1028;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:var(--fd);background:var(--bg);color:var(--txt);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-y:auto}
button{cursor:pointer;border:none;background:none;font-family:var(--fd)}
input,select{font-family:var(--fd);font-size:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

#login{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#login .box{text-align:center;max-width:320px;width:100%}
#login .ico{font-size:56px;margin-bottom:16px}
#login h1{font-family:var(--fs);font-size:32px;color:var(--txt);margin-bottom:8px}
#login p{font-size:13px;color:var(--txt2);line-height:1.65;margin-bottom:32px}
#loginBtn{width:100%;padding:15px;border-radius:14px;background:var(--txt);color:var(--bg);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh2)}
#login .sig{margin-top:28px;padding-top:20px;border-top:.5px solid var(--brd);font-size:11px;color:var(--txt3);line-height:1.8}
#login .sig strong{font-size:13px;color:var(--txt2)}

.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--surf);border-bottom:.5px solid var(--brd2);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:200}
.logo{font-family:var(--fs);font-size:20px;display:flex;align-items:center;gap:8px}
.logo-ico{width:28px;height:28px;background:linear-gradient(135deg,var(--green),var(--green2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-user{font-size:11px;color:var(--txt3);font-family:var(--fd);font-weight:500;display:flex;align-items:center;gap:4px}
.tbr{display:flex;align-items:center;gap:8px}
.ibtn{width:34px;height:34px;border-radius:8px;background:var(--bg2);border:.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2)}
#avatar{display:none;width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--brd2)}
#sync{font-size:17px;line-height:1}

.ay-bar{position:fixed;top:var(--top);left:0;right:0;background:var(--surf);border-bottom:.5px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:46px;z-index:199}
.ay-nav{width:34px;height:34px;border-radius:8px;background:var(--bg2);border:.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2);transition:.15s}
.ay-nav:active{background:var(--bg3)}
.ay-lbl{font-size:15px;font-weight:600;color:var(--txt)}

main{padding-top:calc(var(--top) + 46px);padding-bottom:calc(var(--nav) + 80px)}

.hero{margin:14px 16px 10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hcard{border-radius:16px;padding:14px 12px;text-align:center;position:relative;overflow:hidden;transition:.3s}
.hcard.gelir{background:var(--green-bg);border:.5px solid var(--green)}
.hcard.gider{background:var(--red-bg);border:.5px solid var(--red)}
.hcard.kalan-pos{background:linear-gradient(135deg,var(--green),var(--green2));box-shadow:0 4px 20px rgba(26,122,66,.25)}
.hcard.kalan-neg{background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 4px 20px rgba(192,53,53,.25)}
.hcard-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.hcard.gelir .hcard-lbl{color:var(--green)}
.hcard.gider .hcard-lbl{color:var(--red)}
.hcard.kalan-pos .hcard-lbl,.hcard.kalan-neg .hcard-lbl{color:rgba(255,255,255,.7)}
.hcard-val{font-family:var(--fs);font-size:17px;font-weight:500;line-height:1.2}
.hcard.gelir .hcard-val{color:var(--green)}
.hcard.gider .hcard-val{color:var(--red)}
.hcard.kalan-pos .hcard-val,.hcard.kalan-neg .hcard-val{color:#fff}
.hcard-sub{font-size:9px;color:rgba(255,255,255,.65);margin-top:3px}

.tahmin-band{margin:0 16px 10px;background:var(--surf);border:.5px solid var(--brd2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.tahmin-ico{font-size:20px;flex-shrink:0}
.tahmin-txt{font-size:12px;color:var(--txt2);line-height:1.5;flex:1}
.tahmin-txt strong{color:var(--txt);font-weight:600}

.oneri-wrap{margin:0 16px 10px;background:var(--blue-bg);border:.5px solid var(--blue);border-radius:14px;padding:13px 14px;display:none}
.oneri-ttl{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px}
.oneri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.oneri-item{background:var(--surf);border-radius:10px;padding:10px 8px;text-align:center;border:.5px solid var(--brd)}
.oneri-pct{font-size:15px;font-weight:700}
.oneri-lbl{font-size:10px;color:var(--txt3);margin-top:2px}
.oneri-tutar{font-size:11px;font-weight:600;color:var(--txt);margin-top:3px}

.prg-sec{margin:0 16px 10px;background:var(--surf);border:.5px solid var(--brd2);border-radius:14px;padding:13px 14px}
.prg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prg-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.prg-pct{font-size:12px;font-weight:700}
.prg-bar-wrap{background:var(--bg3);border-radius:var(--rp);height:8px;overflow:hidden}
.prg-bar{height:100%;border-radius:var(--rp);transition:width .6s cubic-bezier(.4,0,.2,1)}
.prg-bar.ok{background:linear-gradient(90deg,var(--green),var(--green2))}
.prg-bar.warn{background:linear-gradient(90deg,var(--amber),#e8c040)}
.prg-bar.danger{background:linear-gradient(90deg,var(--red),var(--red2));animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.prg-bot{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--txt3)}

.tabs{display:flex;margin:0 16px 10px;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.tbtn{flex:1;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:500;color:var(--txt2);text-align:center;transition:.15s;white-space:nowrap}
.tbtn.on{background:var(--surf);color:var(--txt);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.sec{padding:0 16px 6px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:4px}
.sec-ttl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
.sec-total{font-size:12px;font-weight:700}
.sec-total.g{color:var(--green)}
.sec-total.r{color:var(--red)}
.empty-sec{text-align:center;padding:24px 16px;color:var(--txt3);font-size:12.5px;line-height:1.6}
.empty-ico{font-size:32px;opacity:.4;margin-bottom:8px}

.kalem-wrap{position:relative;margin-bottom:7px;border-radius:13px;overflow:hidden}
.kalem-bg{position:absolute;inset:0;display:flex;align-items:center;border-radius:13px}
.kalem-bg-l{flex:1;background:var(--green);display:flex;align-items:center;padding-left:16px}
.kalem-bg-l span{font-size:18px}
.kalem-bg-r{flex:1;background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:16px}
.kalem-bg-r span{font-size:18px}
.kalem{position:relative;background:var(--surf);border:.5px solid var(--brd2);border-radius:13px;display:flex;align-items:center;padding:12px 13px;gap:10px;touch-action:pan-y;user-select:none;will-change:transform;-webkit-backface-visibility:hidden}
.kalem.dragging{box-shadow:var(--sh2);opacity:.9}
.kalem-handle{width:18px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:grab;flex-shrink:0;opacity:.25;padding:4px 0}
.kalem-handle span{width:12px;height:2px;background:var(--txt);border-radius:var(--rp);display:block}
.kalem-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;cursor:pointer}
.kalem-check.on{background:var(--green);border-color:var(--green)}
.kalem-check.on::after{content:'✓';font-size:12px;color:#fff;font-weight:700}
.kalem-info{flex:1;min-width:0}
.kalem-ad{font-size:13px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.kalem-ad.done{text-decoration:line-through;color:var(--txt3)}
.kalem-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.kalem-not{font-size:11px;color:var(--txt3)}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:var(--rp)}
.badge.tekrar{background:var(--blue-bg);color:var(--blue)}
.badge.yatirim{background:var(--purple-bg);color:var(--purple)}
.kalem-tutar{font-size:14px;font-weight:700;flex-shrink:0}
.kalem-tutar.g{color:var(--green)}
.kalem-tutar.r{color:var(--red)}

.mini-chart{margin:0 16px 10px;background:var(--surf);border:.5px solid var(--brd2);border-radius:14px;padding:14px}
.mini-chart-ttl{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:12px}

.fab{position:fixed;bottom:calc(var(--nav)+14px);right:18px;width:52px;height:52px;border-radius:50%;background:var(--txt);color:var(--bg);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.22);z-index:180;transition:.15s}
.fab:active{transform:scale(.92)}

.tip-popup{position:fixed;bottom:calc(var(--nav)+76px);right:16px;background:var(--surf);border:.5px solid var(--brd2);border-radius:16px;padding:6px;box-shadow:var(--sh2);z-index:179;display:none;flex-direction:column;gap:3px;min-width:155px}
.tip-popup.on{display:flex;animation:popUp .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes popUp{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.tip-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;color:var(--txt);transition:.15s;cursor:pointer}
.tip-item:active{background:var(--bg2)}
.tip-item .ti{font-size:18px}

.ai-panel{animation:fadeAi .45s ease;backdrop-filter:blur(12px);}
.hcard,.prg-sec,.tabs,.mini-chart,.oneri-wrap{transition:all .25s ease;}
.hcard:active,.prg-sec:active,.mini-chart:active{transform:scale(.98);}
@keyframes fadeAi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* MODAL: EKLE */
.sbtn.g{background:linear-gradient(135deg,var(--green),var(--green2))}
.sbtn.r{background:linear-gradient(135deg,var(--red),var(--red2))}
.sbtn.p{background:linear-gradient(135deg,var(--purple),#8a60d4)}
</style>
</head>

</html>
