<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f0">
<title>Maaş Günü</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f5f0; --bg2:#edeae3; --bg3:#e3e0d8;
  --surf:#fff; --brd:rgba(0,0,0,.08); --brd2:rgba(0,0,0,.14);
  --txt:#1a1814; --txt2:#706d66; --txt3:#a8a49c;
  --green:#1a7a42; --green-bg:#e6f4ec; --green-light:#4aad78;
  --red:#c03535; --red-bg:#fdeaea;
  --blue:#1a3a8b; --blue-bg:#eaeffa;
  --amber:#b86010; --amber-bg:#fdf3e3;
  --r:12px; --rp:999px; --nav:64px; --top:58px;
  --fd:'DM Sans',sans-serif; --fs:'Instrument Serif',serif;
}
[data-theme=dark] {
  --bg:#100f0d; --bg2:#1a1815; --bg3:#242118;
  --surf:#1e1c18; --brd:rgba(255,255,255,.06); --brd2:rgba(255,255,255,.12);
  --txt:#f0ece4; --txt2:#9a9690; --txt3:#5a5852;
  --green:#4aad78; --green-bg:#0a1f14; --green-light:#4aad78;
  --red:#e05050; --red-bg:#2a0e0e;
  --blue:#5a8ad4; --blue-bg:#0a1228;
  --amber:#e09040; --amber-bg:#201008;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:var(--fd);background:var(--bg);color:var(--txt);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:var(--fd)}
input{font-family:var(--fd);font-size:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#login .box{text-align:center;max-width:320px;width:100%}
#login .ico{font-size:52px;margin-bottom:16px}
#login h1{font-family:var(--fs);font-size:30px;color:var(--txt);margin-bottom:8px}
#login p{font-size:13px;color:var(--txt2);line-height:1.6;margin-bottom:32px}
#loginBtn{width:100%;padding:14px;border-radius:var(--r);background:var(--txt);color:var(--bg);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
#login .sig{margin-top:28px;padding-top:20px;border-top:.5px solid var(--brd);font-size:11px;color:var(--txt3);line-height:1.8}
#login .sig strong{font-size:13px;color:var(--txt2)}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--surf);border-bottom:.5px solid var(--brd2);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:200}
.logo{font-family:var(--fs);font-size:21px;display:flex;align-items:center;gap:8px}
.logo-ico{width:30px;height:30px;background:linear-gradient(135deg,#1a7a42,#2aad62);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.tbr{display:flex;align-items:center;gap:8px}
.ibtn{width:34px;height:34px;border-radius:6px;background:var(--bg2);border:.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2);transition:.15s}
#avatar{display:none;width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--brd2)}
#sync{font-size:17px;line-height:1}

/* AY SEÇİCİ */
.ay-bar{position:fixed;top:var(--top);left:0;right:0;background:var(--surf);border-bottom:.5px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;z-index:199}
.ay-nav{width:32px;height:32px;border-radius:6px;background:var(--bg2);border:.5px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2)}
.ay-lbl{font-size:14px;font-weight:600;color:var(--txt)}

/* MAIN */
main{padding-top:calc(var(--top) + 44px);padding-bottom:calc(var(--nav) + 8px)}

/* ÖZET HERO */
.hero{margin:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hcard{border-radius:14px;padding:14px 12px;text-align:center}
.hcard.gelir{background:var(--green-bg);border:.5px solid var(--green)}
.hcard.gider{background:var(--red-bg);border:.5px solid var(--red)}
.hcard.kalan-pos{background:var(--txt);border:.5px solid var(--txt)}
.hcard.kalan-neg{background:var(--red-bg);border:.5px solid var(--red)}
.hcard-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.hcard.gelir .hcard-lbl{color:var(--green)}
.hcard.gider .hcard-lbl{color:var(--red)}
.hcard.kalan-pos .hcard-lbl{color:rgba(255,255,255,.6)}
.hcard.kalan-neg .hcard-lbl{color:var(--red)}
.hcard-val{font-family:var(--fs);font-size:18px;font-weight:500;line-height:1.2}
.hcard.gelir .hcard-val{color:var(--green)}
.hcard.gider .hcard-val{color:var(--red)}
.hcard.kalan-pos .hcard-val{color:#fff}
.hcard.kalan-neg .hcard-val{color:var(--red)}

/* PROGRESS BAR */
.progress-section{margin:0 16px 8px;background:var(--surf);border:.5px solid var(--brd2);border-radius:14px;padding:14px}
.prg-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prg-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.prg-pct{font-size:12px;font-weight:600}
.prg-bar{height:8px;background:var(--bg3);border-radius:var(--rp);overflow:hidden}
.prg-fill{height:100%;border-radius:var(--rp);transition:width .5s ease}
.prg-fill.ok{background:linear-gradient(90deg,var(--green),var(--green-light))}
.prg-fill.warn{background:linear-gradient(90deg,var(--amber),#e8b423)}
.prg-fill.danger{background:linear-gradient(90deg,var(--red),#e05050)}
.prg-sub{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--txt3)}

/* KALEMLER */
.sec{padding:0 16px 8px}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:4px}
.sec-ttl{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
.sec-total{font-size:12px;font-weight:600}
.sec-total.g{color:var(--green)}
.sec-total.r{color:var(--red)}

.kalem{background:var(--surf);border:.5px solid var(--brd2);border-radius:12px;margin-bottom:6px;display:flex;align-items:center;padding:12px 14px;gap:10px;transition:.15s}
.kalem:active{background:var(--bg2)}
.kalem-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;cursor:pointer}
.kalem-check.checked{background:var(--green);border-color:var(--green)}
.kalem-check.checked::after{content:'✓';font-size:12px;color:#fff;font-weight:700}
.kalem-info{flex:1;min-width:0}
.kalem-ad{font-size:13px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kalem-ad.done{text-decoration:line-through;color:var(--txt3)}
.kalem-not{font-size:11px;color:var(--txt3);margin-top:1px}
.kalem-tutar{font-size:14px;font-weight:600;flex-shrink:0}
.kalem-tutar.g{color:var(--green)}
.kalem-tutar.r{color:var(--red)}
.kalem-del{width:28px;height:28px;border-radius:6px;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;opacity:0;transition:.15s}
.kalem:hover .kalem-del,.kalem:focus-within .kalem-del{opacity:1}

.empty-sec{text-align:center;padding:20px;color:var(--txt3);font-size:12px}

/* FAB */
.fabs{position:fixed;bottom:calc(var(--nav) + 14px);right:16px;display:flex;flex-direction:column;gap:8px;z-index:150}
.fab{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.15);transition:.2s}
.fab.gelir{background:var(--green);color:#fff}
.fab.gider{background:var(--red);color:#fff}
.fab-lbl{position:absolute;right:54px;background:var(--txt);color:var(--bg);padding:4px 10px;border-radius:var(--rp);font-size:11px;font-weight:600;white-space:nowrap;pointer-events:none}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--surf);border-top:.5px solid var(--brd2);display:flex;align-items:center;justify-content:space-around;padding:0 8px 8px;z-index:200}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;color:var(--txt3);font-size:10px;font-weight:500}
.nitem.on{color:var(--green)}
.nico{font-size:20px;line-height:1}

/* TABS */
.tabbar{display:flex;margin:0 16px 8px;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.tbtn{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--txt2);text-align:center;transition:.15s}
.tbtn.on{background:var(--surf);color:var(--txt);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* OVERLAY & MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(2px)}
.ov.on{display:flex;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{width:100%;background:var(--surf);border-radius:20px 20px 0 0;padding:20px 18px 36px;max-height:88dvh;overflow-y:auto;animation:su .28s cubic-bezier(.32,.72,0,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:36px;height:4px;background:var(--bg3);border-radius:var(--rp);margin:0 auto 18px}
.mttl{font-family:var(--fs);font-size:22px;color:var(--txt);margin-bottom:16px}
.igrp{margin-bottom:12px}
.ilbl{font-size:11.5px;font-weight:500;color:var(--txt2);margin-bottom:5px;display:block}
.inp{width:100%;background:var(--bg2);border:.5px solid var(--brd2);border-radius:6px;padding:11px 13px;font-size:14px;font-weight:500;color:var(--txt);outline:none;transition:.15s}
.inp:focus{border-color:var(--green)}
.ipfx{position:relative}
.ipfx .pfx{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--txt3);pointer-events:none}
.ipfx .inp{padding-left:26px}
.sbtn{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:600;margin-top:4px;color:#fff}
.sbtn.g{background:var(--green)}
.sbtn.r{background:var(--red)}

/* GEÇMİŞ */
.gecmis-ay{background:var(--surf);border:.5px solid var(--brd2);border-radius:14px;margin-bottom:10px;overflow:hidden}
.gecmis-ay-h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.gecmis-ay-lbl{font-size:14px;font-weight:600;color:var(--txt)}
.gecmis-ay-kalan{font-size:14px;font-weight:700}
.gecmis-ay-body{display:none;border-top:.5px solid var(--brd);padding:12px 16px}
.gecmis-ay-body.on{display:block}
.gecmis-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.gecmis-row:last-child{margin-bottom:0}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav) + 14px);left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:9px 18px;border-radius:var(--rp);font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1}
.sig-bar{position:fixed;bottom:calc(var(--nav) + 2px);left:0;right:0;text-align:center;font-size:10px;color:var(--txt3);pointer-events:none;z-index:100}

/* PAGE */
.page{display:none}
.page.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <div class="ico">💰</div>
    <h1>Maaş Günü</h1>
    <p>Aylık gelir ve giderlerini takip et.<br>Her cihazında senkronize çalışır.</p>
    <button id="loginBtn" onclick="girisYap()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google ile Giriş Yap
    </button>
    <div class="sig">Tasarım & Fikir<br><strong>Yusuf AYKAÇ</strong></div>
  </div>
</div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo"><div class="logo-ico">💰</div>Maaş Günü</div>
  <div class="tbr">
    <span id="sync">🔄</span>
    <button class="ibtn" id="themeBtn" onclick="temaDegis()">🌙</button>
    <img id="avatar" onclick="cikisYap()" title="Çıkış yap">
  </div>
</header>

<!-- AY SEÇİCİ -->
<div class="ay-bar">
  <button class="ay-nav" onclick="ayDegis(-1)">‹</button>
  <span class="ay-lbl" id="ayLbl">—</span>
  <button class="ay-nav" onclick="ayDegis(1)">›</button>
</div>

<!-- MAIN -->
<main>
  <!-- ÖZET -->
  <div class="hero">
    <div class="hcard gelir"><div class="hcard-lbl">Gelir</div><div class="hcard-val" id="hGelir">₺0</div></div>
    <div class="hcard gider"><div class="hcard-lbl">Gider</div><div class="hcard-val" id="hGider">₺0</div></div>
    <div class="hcard kalan-pos" id="hKalanCard"><div class="hcard-lbl">Kalan</div><div class="hcard-val" id="hKalan">₺0</div></div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="prg-header">
      <span class="prg-lbl">Gider / Gelir Oranı</span>
      <span class="prg-pct" id="prgPct">%0</span>
    </div>
    <div class="prg-bar"><div class="prg-fill ok" id="prgFill" style="width:0%"></div></div>
    <div class="prg-sub">
      <span id="prgOdendi">₺0 ödendi</span>
      <span id="prgKaldi">₺0 kaldı</span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabbar">
    <button class="tbtn on" onclick="icerikTab(0)">📋 Tümü</button>
    <button class="tbtn" onclick="icerikTab(1)">💚 Gelirler</button>
    <button class="tbtn" onclick="icerikTab(2)">🔴 Giderler</button>
  </div>

  <!-- KALEMLER -->
  <div id="icerik"></div>

  <!-- GEÇMİŞ SAYFASI (ayrı) -->
</main>

<!-- FABS -->
<div class="fabs">
  <button class="fab gelir" onclick="modalAc('gelir')" title="Gelir Ekle">＋</button>
  <button class="fab gider" onclick="modalAc('gider')" title="Gider Ekle" style="background:var(--red)">－</button>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nitem on" id="nav0" onclick="navSec(0)"><span class="nico">📋</span>Bu Ay</button>
  <button class="nitem" id="nav1" onclick="navSec(1)"><span class="nico">📅</span>Geçmiş</button>
</nav>

<!-- MODAL: EKLE -->
<div class="ov" id="mEkle" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mttl" id="mEkleTtl">Gelir Ekle</div>
    <div class="igrp">
      <label class="ilbl">Açıklama</label>
      <input class="inp" type="text" id="eAd" placeholder="örn. Maaş, Kira, Netflix…">
    </div>
    <div class="igrp">
      <label class="ilbl">Tutar</label>
      <div class="ipfx"><span class="pfx">₺</span><input class="inp" type="number" id="eTutar" placeholder="0" min="0"></div>
    </div>
    <div class="igrp">
      <label class="ilbl">Not <span style="color:var(--txt3);font-weight:400">(isteğe bağlı)</span></label>
      <input class="inp" type="text" id="eNot" placeholder="örn. Ocak maaşı">
    </div>
    <button class="sbtn g" id="mEkleBtn" onclick="kalemKaydet()">✓ Ekle</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="sig-bar">Yusuf AYKAÇ</div>

<script>
/* ══ FIREBASE ══ */
const CFG = {
  apiKey:'AIzaSyADpIRNLQEIer_gplTgwKi_EKkfcyrYoqY',
  authDomain:'maasgunu-bd353.firebaseapp.com',
  projectId:'maasgunu-bd353',
  storageBucket:'maasgunu-bd353.firebasestorage.app',
  messagingSenderId:'485904329467',
  appId:'1:485904329467:web:579d932ae8f25958901e5e'
};
let db, auth, user = null;

async function fbBaslat() {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getFirestore, doc, setDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const app = initializeApp(CFG);
  db = getFirestore(app); auth = getAuth(app);
  window._fb = { doc, setDoc, getDoc, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut };
  return new Promise(res => onAuthStateChanged(auth, u => { user = u; res(u); }));
}

async function fbKaydet() {
  if (!user) { setSynk('off'); lsKaydet(); return; }
  setSynk('loading');
  try {
    const { doc, setDoc } = window._fb;
    veri.guncelleme = new Date().toISOString();
    lsKaydet();
    await setDoc(doc(db,'users',user.uid,'masaygunu','ana'),{json:JSON.stringify(veri)});
    setSynk('ok');
  } catch(e) { console.warn(e); setSynk('off'); }
}

async function fbYukle() {
  if (!user) return;
  setSynk('loading');
  try {
    const { doc, getDoc } = window._fb;
    const snap = await getDoc(doc(db,'users',user.uid,'masaygunu','ana'));
    if (snap.exists()) {
      const uzak = JSON.parse(snap.data().json||'{}');
      const uAt = uzak.guncelleme||'2000';
      const lAt = veri.guncelleme||'2000';
      if (uAt > lAt) { veri = uzak; lsKaydet(); }
      else if (lAt > uAt) { await fbKaydet(); }
    }
    setSynk('ok');
  } catch(e) { console.warn(e); setSynk('off'); }
}

async function girisYap() {
  const { signInWithPopup, GoogleAuthProvider } = window._fb;
  document.getElementById('loginBtn').textContent = '⏳ Bekle…';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { console.warn(e); document.getElementById('loginBtn').textContent = 'Tekrar Dene'; }
}

async function cikisYap() {
  if (!confirm('Çıkış yapmak istiyor musun?')) return;
  const { signOut } = window._fb;
  await signOut(auth);
}

function setSynk(d) {
  const el = document.getElementById('sync');
  if (!el) return;
  el.textContent = d==='loading'?'🔄':d==='ok'?'☁️':'📵';
}

/* ══ LOCAL STORAGE ══ */
const LS = 'masaygunu_v1';
function lsKaydet() { try { localStorage.setItem(LS, JSON.stringify(veri)); } catch {} }
function lsYukle() { try { const d=JSON.parse(localStorage.getItem(LS)||'null'); if(d&&d.aylar) veri=d; } catch {} }

/* ══ VERİ ══ */
let veri = { aylar:{}, guncelleme:null };
// aylar: { '2025-05': { gelirler:[{id,ad,tutar,not,odendi}], giderler:[...] } }

let aktifAy = bugunAy();
let aktifTip = 'gelir'; // modal için
let icerikTabIdx = 0;
let navIdx = 0;

function bugunAy() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function ayVerisi(ay) {
  if (!veri.aylar[ay]) veri.aylar[ay] = { gelirler:[], giderler:[] };
  return veri.aylar[ay];
}

/* ══ AY ══ */
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function ayYazi(anahtar) {
  const [y,m] = anahtar.split('-');
  return AYLAR[parseInt(m)-1] + ' ' + y;
}

function ayDegis(delta) {
  const [y,m] = aktifAy.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  aktifAy = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();
}

/* ══ HESAPLA ══ */
function hesapla(ay) {
  const v = ayVerisi(ay);
  const topGelir = v.gelirler.reduce((s,k)=>s+k.tutar,0);
  const topGider = v.giderler.reduce((s,k)=>s+k.tutar,0);
  const odendi = v.giderler.filter(k=>k.odendi).reduce((s,k)=>s+k.tutar,0);
  const kalan = topGelir - topGider;
  const oran = topGelir>0 ? Math.min(100,Math.round(topGider/topGelir*100)) : 0;
  return { topGelir, topGider, odendi, kalan, oran };
}

/* ══ RENDER ══ */
function render() {
  document.getElementById('ayLbl').textContent = ayYazi(aktifAy);

  const h = hesapla(aktifAy);
  document.getElementById('hGelir').textContent = fTL(h.topGelir);
  document.getElementById('hGider').textContent = fTL(h.topGider);
  document.getElementById('hKalan').textContent = fTL(Math.abs(h.kalan));

  const kalanCard = document.getElementById('hKalanCard');
  kalanCard.className = 'hcard ' + (h.kalan >= 0 ? 'kalan-pos' : 'kalan-neg');

  // Progress
  const prgFill = document.getElementById('prgFill');
  const prgClass = h.oran < 70 ? 'ok' : h.oran < 90 ? 'warn' : 'danger';
  prgFill.className = 'prg-fill ' + prgClass;
  prgFill.style.width = h.oran + '%';
  document.getElementById('prgPct').textContent = '%' + h.oran;
  document.getElementById('prgPct').style.color = h.oran < 70 ? 'var(--green)' : h.oran < 90 ? 'var(--amber)' : 'var(--red)';
  document.getElementById('prgOdendi').textContent = fTL(h.odendi) + ' ödendi';
  document.getElementById('prgKaldi').textContent = fTL(Math.max(0,h.topGider-h.odendi)) + ' kaldı';

  icerikRender();
  if (navIdx === 1) gecmisRender();
}

function icerikRender() {
  const v = ayVerisi(aktifAy);
  const el = document.getElementById('icerik');
  let html = '';

  const gosterGelir = icerikTabIdx === 0 || icerikTabIdx === 1;
  const gosterGider = icerikTabIdx === 0 || icerikTabIdx === 2;

  if (gosterGelir) {
    const topGelir = v.gelirler.reduce((s,k)=>s+k.tutar,0);
    html += `
      <div class="sec">
        <div class="sec-header">
          <span class="sec-ttl">💚 Gelirler</span>
          <span class="sec-total g">${fTL(topGelir)}</span>
        </div>
        ${v.gelirler.length ? v.gelirler.map(k=>kalemHtml(k,'gelir')).join('') : '<div class="empty-sec">Henüz gelir yok</div>'}
      </div>`;
  }

  if (gosterGider) {
    const topGider = v.giderler.reduce((s,k)=>s+k.tutar,0);
    html += `
      <div class="sec">
        <div class="sec-header">
          <span class="sec-ttl">🔴 Giderler</span>
          <span class="sec-total r">${fTL(topGider)}</span>
        </div>
        ${v.giderler.length ? v.giderler.map(k=>kalemHtml(k,'gider')).join('') : '<div class="empty-sec">Henüz gider yok</div>'}
      </div>`;
  }

  el.innerHTML = html;
}

function kalemHtml(k, tip) {
  const renk = tip === 'gelir' ? 'g' : 'r';
  return `
    <div class="kalem">
      <div class="kalem-check ${k.odendi?'checked':''}" onclick="toggleOdendi('${tip}','${k.id}')"></div>
      <div class="kalem-info">
        <div class="kalem-ad ${k.odendi?'done':''}">${k.ad}</div>
        ${k.not?`<div class="kalem-not">${k.not}</div>`:''}
      </div>
      <div class="kalem-tutar ${renk}">${fTL(k.tutar)}</div>
      <button class="kalem-del" onclick="kalemSil('${tip}','${k.id}')">×</button>
    </div>`;
}

function gecmisRender() {
  const el = document.getElementById('icerik');
  const aylar = Object.keys(veri.aylar).sort((a,b)=>b.localeCompare(a));

  if (!aylar.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--txt3);font-size:13px">Henüz kayıt yok</div>';
    return;
  }

  el.innerHTML = aylar.map(ay => {
    const h = hesapla(ay);
    const renkClass = h.kalan >= 0 ? 'var(--green)' : 'var(--red)';
    return `
      <div class="sec">
        <div class="gecmis-ay">
          <div class="gecmis-ay-h" onclick="document.getElementById('ga${ay}').classList.toggle('on')">
            <span class="gecmis-ay-lbl">${ayYazi(ay)}</span>
            <span class="gecmis-ay-kalan" style="color:${renkClass}">${h.kalan>=0?'+':''}${fTL(h.kalan)}</span>
          </div>
          <div class="gecmis-ay-body" id="ga${ay}">
            <div class="gecmis-row"><span style="color:var(--txt2)">Gelir</span><span style="color:var(--green);font-weight:600">${fTL(h.topGelir)}</span></div>
            <div class="gecmis-row"><span style="color:var(--txt2)">Gider</span><span style="color:var(--red);font-weight:600">${fTL(h.topGider)}</span></div>
            <div class="gecmis-row"><span style="color:var(--txt2)">Ödenen</span><span style="font-weight:500">${fTL(h.odendi)}</span></div>
            <div class="gecmis-row" style="border-top:.5px solid var(--brd);padding-top:8px;margin-top:4px">
              <span style="font-weight:600">Kalan</span>
              <span style="color:${renkClass};font-weight:700">${h.kalan>=0?'+':''}${fTL(h.kalan)}</span>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ══ KALEM İŞLEMLERİ ══ */
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function modalAc(tip) {
  aktifTip = tip;
  document.getElementById('mEkleTtl').textContent = tip === 'gelir' ? 'Gelir Ekle' : 'Gider Ekle';
  document.getElementById('mEkleBtn').className = 'sbtn ' + (tip==='gelir'?'g':'r');
  document.getElementById('eAd').value = '';
  document.getElementById('eTutar').value = '';
  document.getElementById('eNot').value = '';
  document.getElementById('mEkle').classList.add('on');
  setTimeout(() => document.getElementById('eAd').focus(), 300);
}

async function kalemKaydet() {
  const ad = document.getElementById('eAd').value.trim();
  const tutar = parseFloat(document.getElementById('eTutar').value)||0;
  const not = document.getElementById('eNot').value.trim();
  if (!ad) { toast('⚠️ Açıklama gir'); return; }
  if (!tutar) { toast('⚠️ Tutar gir'); return; }

  const v = ayVerisi(aktifAy);
  const kalem = { id:uid(), ad, tutar, not, odendi:false };
  if (aktifTip === 'gelir') v.gelirler.push(kalem);
  else v.giderler.push(kalem);

  document.getElementById('mEkle').classList.remove('on');
  render();
  await fbKaydet();
  toast('✅ ' + (aktifTip==='gelir'?'Gelir':'Gider') + ' eklendi');
}

async function kalemSil(tip, id) {
  const v = ayVerisi(aktifAy);
  if (tip === 'gelir') v.gelirler = v.gelirler.filter(k=>k.id!==id);
  else v.giderler = v.giderler.filter(k=>k.id!==id);
  render();
  await fbKaydet();
  toast('🗑 Silindi');
}

async function toggleOdendi(tip, id) {
  const v = ayVerisi(aktifAy);
  const liste = tip === 'gelir' ? v.gelirler : v.giderler;
  const k = liste.find(x=>x.id===id);
  if (k) k.odendi = !k.odendi;
  render();
  await fbKaydet();
}

/* ══ TAB ══ */
function icerikTab(i) {
  icerikTabIdx = i;
  document.querySelectorAll('.tbtn').forEach((b,idx)=>b.classList.toggle('on',idx===i));
  icerikRender();
}

function navSec(i) {
  navIdx = i;
  document.querySelectorAll('.nitem').forEach((b,idx)=>b.classList.toggle('on',idx===i));
  const mainEl = document.querySelector('main');

  if (i === 0) {
    // Bu ay
    document.querySelector('.hero').style.display = 'grid';
    document.querySelector('.progress-section').style.display = 'block';
    document.querySelector('.tabbar').style.display = 'flex';
    document.querySelector('.fabs').style.display = 'flex';
    render();
  } else {
    // Geçmiş
    document.querySelector('.hero').style.display = 'none';
    document.querySelector('.progress-section').style.display = 'none';
    document.querySelector('.tabbar').style.display = 'none';
    document.querySelector('.fabs').style.display = 'none';
    gecmisRender();
  }
}

/* ══ YARDIMCILAR ══ */
function fTL(n) { return '₺'+(Math.round(Math.abs(n))||0).toLocaleString('tr-TR'); }
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2400); }
function temaDegis() {
  const dark = document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme = dark?'light':'dark';
  document.getElementById('themeBtn').textContent = dark?'🌙':'☀️';
  localStorage.setItem('masaygunuTema', document.documentElement.dataset.theme);
}

/* ══ INIT ══ */
async function init() {
  const tema = localStorage.getItem('masaygunuTema')||'light';
  document.documentElement.dataset.theme = tema;
  document.getElementById('themeBtn').textContent = tema==='dark'?'☀️':'🌙';

  const u = await fbBaslat();

  if (!u) {
    document.getElementById('login').style.display = 'flex';
    window._fb.onAuthStateChanged(auth, async kullanici => {
      if (kullanici) {
        user = kullanici;
        document.getElementById('login').style.display = 'none';
        const av = document.getElementById('avatar');
        if (kullanici.photoURL) { av.src=kullanici.photoURL; av.style.display='block'; }
        lsYukle(); render();
        await fbYukle(); render();
        setSynk('ok');
        setInterval(fbKaydet, 60000);
      } else {
        user = null;
        veri = { aylar:{}, guncelleme:null };
        document.getElementById('login').style.display = 'flex';
      }
    });
    return;
  }

  document.getElementById('login').style.display = 'none';
  const av = document.getElementById('avatar');
  if (u.photoURL) { av.src=u.photoURL; av.style.display='block'; }
  lsYukle(); render();
  await fbYukle(); render();
  setSynk('ok');
  setInterval(fbKaydet, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
